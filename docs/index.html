<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A daily log of research papers rebuilt from scratch to run on a CPU: plain-words explanations, build notes, results and captured runs.">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font-size: 14px; font-family: system-ui, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Paper Implementations</title>

<style>
/* Layout: a lab log. Index = dated ledger of runs; each paper opens as its own report page
   with plain-words explanation, build notes, a chart, captured terminal runs and core code. */
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --ink: #142030;
  --muted: #576579;
  --line: #dce2ea;
  --accent: #2153c8;
  --accent-soft: #e6edfb;
  --bar: #b9c3d0;
  --bar-hi: #257de0;
  --good: #0a7d1e;
  --warn: #9a6400;
  --term-bg: #0e1520;
  --term-bar: #18212f;
  --term-ink: #d5deea;
  --term-dim: #7f8ea3;
  --term-ok: #7fd98f;
  --code-comment: #6b7a8f;
  --code-str: #1d7a5a;
  --code-bg: #f7f9fc;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d131b; --surface: #141c27; --ink: #e5ebf2; --muted: #95a3b5; --line: #253041;
  --accent: #86a8ff; --accent-soft: #1b2740; --bar: #4a5667; --bar-hi: #338ced;
  --good: #5fcf73; --warn: #e3b04b; --term-bg: #080c12; --term-bar: #111823;
  --term-ink: #d5deea; --term-dim: #7f8ea3; --term-ok: #7fd98f;
  --code-comment: #7d8ba0; --code-str: #7fd0ad; --code-bg: #101722; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0d131b; --surface: #141c27; --ink: #e5ebf2; --muted: #95a3b5; --line: #253041;
  --accent: #86a8ff; --accent-soft: #1b2740; --bar: #4a5667; --bar-hi: #338ced;
  --good: #5fcf73; --warn: #e3b04b; --term-bg: #080c12; --term-bar: #111823;
  --term-ink: #d5deea; --term-dim: #7f8ea3; --term-ok: #7fd98f;
  --code-comment: #7d8ba0; --code-str: #7fd0ad; --code-bg: #101722; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.6 var(--font-body); }
.wrap { max-width: 1060px; margin: 0 auto; padding-block: 40px 72px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
a { color: var(--accent); }
a:focus-visible, button:focus-visible, .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
.eyebrow { font: 600 12px/1 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.mono { font-family: var(--font-mono); }

/* ---------- index ---------- */
.masthead { display: grid; gap: 14px; padding-bottom: 28px; border-bottom: 1px solid var(--line); }
.masthead h1 { font-size: clamp(2.2rem, 5vw, 3.4rem); font-weight: 700; line-height: 1.02; }
.masthead p { margin: 0; max-width: 62ch; color: var(--muted); font-size: 1.05rem; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 22px; font: 13px/1.4 var(--font-mono); color: var(--muted); }
.facts b { color: var(--ink); font-weight: 600; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; padding-block: 22px 10px; }
.chip { font: 500 13px/1 var(--font-body); padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.ledger { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: 7.2rem minmax(0, 1fr) auto; gap: 6px 22px; align-items: baseline;
  padding: 18px 10px; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
.row:hover { background: var(--surface); }
.row .d { font: 13px/1.5 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.row .t { min-width: 0; }
.row h2 { font-size: 1.22rem; font-weight: 600; line-height: 1.25; }
.row .tag { margin: 4px 0 0; color: var(--muted); font-size: 0.95rem; }
.row .meta { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; font: 12px/1.3 var(--font-mono); color: var(--muted); white-space: nowrap; }
.area { color: var(--ink); }
.verdict { display: inline-flex; align-items: center; gap: 6px; font: 500 12px/1.3 var(--font-body); }
.verdict::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.verdict.full { color: var(--good); }
.verdict.part { color: var(--warn); }
@media (max-width: 640px) {
  .row { grid-template-columns: minmax(0, 1fr); }
  .row .meta { flex-direction: row; align-items: center; gap: 14px; }
}

/* ---------- detail ---------- */
.crumbs { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font: 13px/1.4 var(--font-mono); }
.crumbs a { text-decoration: none; }
.hero { display: grid; gap: 14px; padding-block: 26px 30px; border-bottom: 1px solid var(--line); }
.hero h1 { font-size: clamp(1.8rem, 4vw, 2.7rem); font-weight: 700; line-height: 1.08; max-width: 26ch; }
.hero .full-title { margin: 0; color: var(--muted); font-style: italic; max-width: 70ch; }
.hero .tagline { margin: 0; font-size: 1.15rem; max-width: 60ch; }
.hero .links { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { font: 500 14px/1 var(--font-body); padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); text-decoration: none; display: inline-flex; gap: 8px; align-items: center; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
section.block { display: grid; grid-template-columns: 12rem minmax(0, 1fr); gap: 10px 32px; padding-block: 30px; border-bottom: 1px solid var(--line); }
section.block > h2 { font-size: 1.05rem; font-weight: 600; padding-top: 2px; }
section.block .body { min-width: 0; display: grid; gap: 14px; }
section.block p { margin: 0; max-width: 66ch; }
@media (max-width: 760px) { section.block { grid-template-columns: minmax(0, 1fr); } }
.plain p:first-child { font-size: 1.1rem; }
ul.built { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; max-width: 70ch; }
ul.built li { padding-left: 22px; position: relative; }
ul.built li::before { content: ""; position: absolute; left: 4px; top: 0.72em; width: 8px; height: 2px; background: var(--accent); }
.note { font-size: 0.92rem; color: var(--muted); border-left: 2px solid var(--line); padding-left: 12px; }

.chart-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 18px 12px; display: grid; gap: 8px; }
.chart-card h3 { font: 600 15px/1.3 var(--font-body); }
.chart-sub { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; }
.key { display: inline-flex; align-items: center; gap: 6px; }
.key i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.chart-scroll { overflow-x: auto; }
.chart svg { display: block; width: 100%; height: auto; }
.chart text { font-family: var(--font-body); }
.chart .bar { transition: opacity .15s; }
.chart .hit:hover + .bar, .chart .hit:focus + .bar { opacity: .8; }
details.table summary { cursor: pointer; font-size: 13px; color: var(--muted); }
details.table table { margin-top: 8px; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
details.table td, details.table th { padding: 4px 14px 4px 0; text-align: left; border-bottom: 1px solid var(--line); }
.tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--bg); font: 12px/1.35 var(--font-body);
  padding: 6px 9px; border-radius: 6px; z-index: 20; }

.term { background: var(--term-bg); color: var(--term-ink); border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
.term-bar { display: flex; align-items: center; gap: 10px; padding: 9px 14px; background: var(--term-bar); font: 12px/1.3 var(--font-mono); color: var(--term-dim); flex-wrap: wrap; }
.dots { display: inline-flex; gap: 6px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: #3a4556; display: inline-block; }
.term-bar .cmd { color: var(--term-ink); }
.term-bar .ok { margin-left: auto; color: var(--term-ok); }
.term pre { margin: 0; padding: 14px 16px; font: 12.5px/1.55 var(--font-mono); overflow: auto; max-height: 460px; white-space: pre; tab-size: 4; }
.term pre .prompt { color: var(--term-ok); }
.term.tests pre { max-height: 200px; }

.code { background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.code-head { padding: 9px 14px; font: 12px/1.3 var(--font-mono); color: var(--muted); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.code pre { margin: 0; padding: 12px 0; font: 12.5px/1.6 var(--font-mono); overflow-x: auto; }
.code .ln { display: block; padding: 0 16px 0 0; white-space: pre; }
.code .ln::before { content: attr(data-n); display: inline-block; width: 3.4em; padding-right: 1em; text-align: right; color: var(--muted); opacity: .6; user-select: none; }
.code .c { color: var(--code-comment); font-style: italic; }
.code .s { color: var(--code-str); }
.code .gap { color: var(--muted); padding-left: 4.4em; display: block; }

ol.results { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; max-width: 70ch; }
ol.results li { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr); }
ol.results li::before { content: counter(list-item); font: 600 13px/1.7 var(--font-mono); color: var(--accent); }
.pager { display: flex; justify-content: space-between; gap: 16px; padding-top: 28px; flex-wrap: wrap; }
.pager a { text-decoration: none; display: grid; gap: 2px; max-width: 46%; }
.pager a span { font: 12px/1.3 var(--font-mono); color: var(--muted); }
.pager a.next { text-align: right; margin-left: auto; }
footer { padding-top: 36px; font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<script>
const DATA = [{"slug": "2026-11-13-precision-on-demand", "date": "2026-11-13", "short": "Precision on Demand", "title": "Precision on Demand: Escalating Weight Bits at Uncertain Decoding Steps in a Small Local Model", "arxiv": "2611.14418", "area": "LLM inference", "tagline": "Read half the weight bits per token, and only pay for full precision when the model is unsure.", "simple": ["Running a language model on a laptop is slow mostly because every new word means reading every weight from memory. If you store weights in 8 bits but only read the top 4 bits, you read half as much data and go faster, at the cost of a slightly blurrier model.", "Most of the time the blurry model picks the same next word anyway. This paper checks how confident the cheap pass is. When it looks unsure (two words almost tied, or the probabilities spread out), it redoes that one step with all 8 bits. You only pay for precision on the hard steps."], "built": ["A tiny character-level language model (about 110K weights) written in pure NumPy with hand-written backprop, trained in about 20 seconds on Python's own docstrings, so nothing has to be downloaded.", "Weights are stored once as int8. The cheap pass reads q >> 4 (the top nibble) with midpoint reconstruction, so both passes share one tensor, exactly like the paper's setup.", "Two gates (entropy and top-2 margin) with thresholds calibrated on a held-out split to hit a target escalation budget, plus a random gate as the control.", "An offline replay that measures how well each gate predicts flips, and a live greedy-generation test against the full-precision output."], "code": {"file": "gates.py", "ranges": [[17, 30], [60, 64]]}, "chart": {"title": "Flips caught at a 15% escalation budget", "unit": "share of flips", "better": "higher", "fmt": "pct", "bars": [["Margin gate", 0.46, 1], ["Entropy gate", 0.397, 1], ["Random gate", 0.149, 0]]}, "verdict": "Reproduced in shape", "takeaways": ["The cheap pass's uncertainty predicts flips well: AUC 0.80 for entropy and 0.87 for margin.", "At a 15% budget the margin gate catches 46% of flips against 15% for random, about 3x better than chance. Margin beating entropy matches the paper's ordering.", "Accuracy gains are real but small, which matches the paper calling its live results inconclusive."], "note": "The corpus is built from the installed Python's own docstrings, so this rerun (Python 3.14) has a slightly different test set than my original run: 53,323 steps instead of 53,911. The numbers move in the third decimal; the conclusions are the same.", "codeChunks": [{"start": 17, "lines": ["def uncertainty_scores(logp_low):", "    \"\"\"Higher score = more uncertain = more deserving of escalation.\"\"\"", "    return {\"entropy\": entropy(logp_low), \"margin\": -top2_margin(logp_low)}", "", "", "def threshold_for_budget(scores, budget):", "    \"\"\"Threshold such that ~`budget` fraction of steps have score > threshold.\"\"\"", "    if budget <= 0:", "        return np.inf", "    if budget >= 1:", "        return -np.inf", "    return float(np.quantile(scores, 1.0 - budget))", "", ""]}, {"start": 60, "lines": ["def gated_logp(lhi, llo, escalate):", "    \"\"\"Policy output: high-pass distribution where escalated, low-pass elsewhere.\"\"\"", "    return np.where(escalate[:, None], lhi, llo)", "", ""]}], "demo": "corpus 533,306 chars | vocab 96 | train 426,636 | cal 53,323 | test 53,323\ntraining fp32 model ...\n  step     1  loss 4.735\n  step  1000  loss 1.775\n  step  2000  loss 1.547\n  step  3000  loss 1.458\n  step  4000  loss 1.418\n  step  5000  loss 1.196\n  step  6000  loss 1.312\n\nnext-char acc  fp32 0.5456 | int8 (high) 0.5453 | top-4-bit (low) 0.5240\nargmax flips (low != high) on test: 0.1915 of 53,323 steps\n\n[offline replay] flip-prediction AUC\n  entropy  AUC = 0.801\n  margin   AUC = 0.871\n\n[gated policies on test, thresholds calibrated on held-out cal split]\n  policy      budget  esc.rate  flips caught  acc     mean KL(hi||pol)  bytes(nibble)  bytes(rerun)\n  all-low      0.00     0.000         0.000   0.5240          0.10446         0.500        0.500\n  entropy      0.05     0.052         0.151   0.5251          0.09615         0.526        0.552\n  margin       0.05     0.052         0.171   0.5268          0.09656         0.526        0.552\n  random       0.05     0.050         0.048   0.5251          0.09936         0.525        0.550\n  entropy      0.10     0.108         0.285   0.5266          0.08735         0.554        0.608\n  margin       0.10     0.099         0.312   0.5290          0.08955         0.550        0.599\n  random       0.10     0.102         0.100   0.5266          0.09404         0.551        0.602\n  entropy      0.15     0.166         0.397   0.5277          0.07835         0.583        0.666\n  margin       0.15     0.152         0.460   0.5319          0.08155         0.576        0.652\n  random       0.15     0.149         0.149   0.5266          0.08899         0.574        0.649\n  entropy      0.25     0.271         0.585   0.5312          0.06190         0.636        0.771\n  margin       0.25     0.256         0.682   0.5375          0.06605         0.628        0.756\n  random       0.25     0.250         0.249   0.5294          0.07871         0.625        0.750\n  all-high     1.00     1.000         1.000   0.5453          0.00000         1.000        1.500\n\n[free-running greedy generation: 60 prompts x 80 tokens, budget 0.15]\n  policy     esc.rate  token-agree w/ high  mean prefix-match  exact-match seqs\n  all-low      0.000                0.189                8.6        4/60\n  entropy      0.117                0.233               12.1        4/60\n  margin       0.089                0.254               13.0        4/60\n  random       0.148                0.200                9.7        4/60\n\nsample prompt: 'ry whose'\n  high   : ' are not all the transport that are also instance of the returned by the connect'\n  low    : ' are used to converted.  The default fram has empty sequences all the transport '\n  entropy: ' are not all the transport the string the context manager to the current the con'\n\ndone in 68s", "demoCmd": "python demo.py", "demoStatus": "exit 0 · 69s · run 2026-11-26", "tests": "...........                                                              [100%]\n11 passed in 0.17s", "testCmd": "python -m pytest -q", "testsPassed": 11, "testStatus": "11 passed"}, {"slug": "2026-11-14-foam-optimizer", "date": "2026-11-14", "short": "FOAM", "title": "FOAM: Factored One-sided Adam-Moment for Practical and Scalable SOAP", "arxiv": "2611.16905", "area": "Optimizers", "tagline": "Keep most of SOAP's faster training while cutting its optimizer memory roughly in half.", "simple": ["Optimizers decide how to nudge each weight during training. Adam treats every weight on its own. SOAP is smarter: it first rotates the problem into a coordinate system where the directions are independent, then runs Adam there. It trains in fewer steps, but it needs a lot of extra memory.", "FOAM makes SOAP cheaper in two ways. It only rotates one side of each weight matrix (the input side), and instead of remembering a full table of statistics, it remembers one number per row and one per column and multiplies them back together."], "built": ["SGD-momentum, Adam, SOAP and FOAM, all in NumPy, with an ablation flag that keeps the one-sided rotation but uses a full (unfactored) second moment.", "A 2-layer tanh MLP with manual backprop on a deliberately ill-conditioned teacher-student regression task (condition number 100), where preconditioning should matter.", "A learning-rate sweep with 3 seeds per optimizer, reporting the best eval loss and how many floats of optimizer state each one keeps.", "A unit test that numerically checks the paper's rank-1 claim for the rotated second moment."], "code": {"file": "optimizers.py", "ranges": [[118, 150]]}, "chart": {"title": "Eval loss at the best learning rate (3 seeds)", "unit": "MSE", "better": "lower", "fmt": "f4", "bars": [["SGD-momentum", 0.4887, 0], ["Adam", 0.1419, 0], ["One-sided, dense V", 0.0635, 0], ["FOAM", 0.0563, 1], ["SOAP", 0.034, 0]]}, "verdict": "Partly reproduced", "note": "The rerun uses a different NumPy build and BLAS thread count than my original run, so the preconditioned optimizers' losses differ slightly from the README (FOAM 0.0563 here vs 0.0596). The ranking is unchanged.", "takeaways": ["FOAM beats Adam by a wide margin (0.056 vs 0.142) and uses 45% less optimizer state than SOAP.", "Factoring the second moment was free: FOAM did as well as the dense-V ablation, consistent with the paper's rank-1 argument.", "Dropping the output-side rotation was not free in this small MLP: SOAP stayed about 1.7x better. The paper's assumption fits transformer layers better than a tightly coupled tiny MLP."], "codeChunks": [{"start": 118, "lines": ["    def _update(self, k, p, g, s):", "        if p.ndim != 2:", "            return _adam_vector(p, g, s, self.lr, self.b1, self.b2, self.eps, self.t)", "        m, n = p.shape", "        if \"R\" not in s:", "            s[\"R\"] = np.zeros((n, n)); s[\"QR\"] = np.eye(n)", "            s[\"m\"] = np.zeros_like(p)", "            if self.factored:", "                s[\"vr\"] = np.zeros(m); s[\"vc\"] = np.zeros(n)", "            else:", "                s[\"v\"] = np.zeros_like(p)", "        # (1) input-side Kronecker factor only", "        s[\"R\"] = self.sb * s[\"R\"] + (1 - self.sb) * g.T @ g", "        if self.t == 1 or self.t % self.freq == 0:", "            s[\"QR\"] = _eigvecs(s[\"R\"])", "        QR = s[\"QR\"]", "        s[\"m\"] = self.b1 * s[\"m\"] + (1 - self.b1) * g", "        g_rot = g @ QR                # rotate input side only", "        m_rot = s[\"m\"] @ QR", "        g2 = g_rot ** 2", "        bc2 = 1 - self.b2 ** self.t", "        if self.factored:", "            # (2) factored second moment: row / column statistics", "            s[\"vr\"] = self.b2 * s[\"vr\"] + (1 - self.b2) * g2.mean(axis=1)", "            s[\"vc\"] = self.b2 * s[\"vc\"] + (1 - self.b2) * g2.mean(axis=0)", "            vh = np.outer(s[\"vr\"], s[\"vc\"]) / (s[\"vr\"].mean() + 1e-30) / bc2", "        else:", "            s[\"v\"] = self.b2 * s[\"v\"] + (1 - self.b2) * g2", "            vh = s[\"v\"] / bc2", "        mh = m_rot / (1 - self.b1 ** self.t)", "        p -= self.lr * ((mh / (np.sqrt(vh) + self.eps)) @ QR.T)", "", ""]}], "demo": "Task: teacher-student regression, MLP 64-128-16, 600 steps, batch 128, seeds (0, 1, 2)\n\noptimizer                         best lr    eval loss (mean±sd)  state floats  ms/step  per-lr mean loss\nSGD-momentum                          0.3       0.4887 ± 0.0302         10384     1.16  0.1:1.1072  0.3:0.4887  1:inf\nAdam                                  0.1       0.1419 ± 0.0147         20768     1.60  0.01:1.1121  0.03:0.3302  0.1:0.1419  0.3:8.1910\nSOAP (two-sided, dense V)            0.03       0.0340 ± 0.0006         95008     3.94  0.01:0.1606  0.03:0.0340  0.1:0.7937\nOne-sided, dense V (ablation)        0.03       0.0635 ± 0.0026         61728     2.13  0.01:0.5546  0.03:0.0635  0.1:0.8956\nFOAM (one-sided, factored V)         0.03       0.0563 ± 0.0048         51824     2.22  0.01:0.5377  0.03:0.0563  0.1:0.9087", "demoCmd": "python demo.py", "demoStatus": "exit 0 · 90s · run 2026-11-26", "tests": "......                                                                   [100%]\n6 passed in 0.22s", "testCmd": "python -m pytest -q", "testsPassed": 6, "testStatus": "6 passed"}, {"slug": "2026-11-15-simplehc", "date": "2026-11-15", "short": "SimpleHC", "title": "On the Design of Hyper-Connections: Simplification, Stability, and Scalability (SimpleHC)", "arxiv": "2611.05984", "area": "Architectures", "tagline": "Hyper-connections without the mixing matrix, executed in groups so the wide state is read far less often.", "simple": ["In a normal network each layer adds its output onto one running total (the residual stream). Hyper-connections keep several parallel streams instead, and each layer learns how much to read from and write to each one. That improves quality, but the wider state has to be read and written over and over, which makes training slower.", "SimpleHC drops the part that mixes streams together and works on layers in groups of four. It reads the wide state once per group, fixes up each layer's input with a few cheap scalar corrections, and writes back once at the end."], "built": ["Five residual-stream variants in one file: vanilla, mHC (dynamic gates plus a Sinkhorn mixing matrix), identity-HC, grouped SimpleHC, and a sequential reference of SimpleHC to check against.", "Written with autograd.numpy so the same code trains end to end.", "An access counter that counts every full read and write of the wide residual state.", "A tiny next-character model trained on a synthetic Markov source whose best possible loss is known, so every variant can be compared against the floor."], "code": {"file": "simplehc.py", "ranges": [[172, 197]]}, "chart": {"title": "Full residual-state reads + writes over 8 sublayers", "unit": "accesses", "better": "lower", "fmt": "int", "bars": [["Identity-HC (per sublayer)", 24, 0], ["SimpleHC (groups of 4)", 6, 1]]}, "verdict": "Reproduced", "takeaways": ["Grouped execution is bit-for-bit identical to the sequential version (within 1e-10, forward and gradients).", "It cuts full-state reads 4x and writes 4x, the exact 8-to-2 and 4-to-1 counts in the paper.", "SimpleHC matches mHC on quality (val 1.390 vs 1.394) with no mixing, and every hyper-connection variant beats the plain residual."], "codeChunks": [{"start": 172, "lines": ["def stream_simplehc(layers, X, K=4, counter=None):", "    \"\"\"SimpleHC grouped execution (Algorithm 1 in spirit):", "        V = X_L^T H_pre                      one batched read", "        D = tril(H_pre^T H_post, -1)         K x K scalar corrections", "        u_a = V[:, a] + sum_{b<a} D[a,b] o_b", "        X_{L+K} = X_L + sum_k h_post_k o_k^T one deferred write", "    \"\"\"", "    for L in range(0, len(layers), K):", "        group = layers[L:L + K]", "        k = len(group)", "        H_pre, H_post = group_gates(group, X)                  # read 1 (z)", "        V = np.matmul(np.transpose(H_pre, (0, 2, 1)), X)      # read 2 (batched), (B,k,C)", "        D = np.einsum(\"zni,znj->zij\", H_pre, H_post)           # (B, k, k), cheap", "        outs = []", "        for a, layer in enumerate(group):", "            u = V[:, a, :]", "            for b_ in range(a):", "                u = u + D[:, a, b_][:, None] * outs[b_]", "            outs.append(mlp_sublayer(layer[\"F\"], u))", "        O = np.stack(outs, axis=1)                             # (B, k, C)", "        X = X + np.matmul(H_post, O)                           # single write", "        if counter:", "            counter.reads += 2", "            counter.writes += 1", "    return X", ""]}], "demo": "source entropy floor (val): 1.2810 nats | unigram-uniform: 2.0794\nmodel: 8 MLP sublayers, C=32, n=4 streams, K=4, 400 Adam steps\n\nvariant      params   train     val  max|g| g-jitter time(s)\nvanilla       36352  1.3888  1.4257    3.78    0.103     4.7\nmhc           61144  1.3791  1.3944    7.24    0.103    29.8\nidentityhc    44624  1.3774  1.3946    7.26    0.104    12.2\nsimplehc      44624  1.3723  1.3898    7.25    0.098    13.0\n\nresidual-stream overhead (F = identity, B=1024, C=512, n=4, 8 sublayers):\n  identityhc (per-sublayer)     281.9 ms   full-state reads=16 writes= 8\n  simplehc (grouped K=4)        282.5 ms   full-state reads= 4 writes= 2", "demoCmd": "python demo.py", "demoStatus": "exit 0 · 127s · run 2026-11-26", "tests": "........                                                                 [100%]\n8 passed in 12.30s", "testCmd": "python -m pytest -q", "testsPassed": 8, "testStatus": "8 passed"}, {"slug": "2026-11-16-value-of-thinking", "date": "2026-11-16", "short": "Value of Thinking", "title": "The Value of Thinking: Learning When to Reason in Hybrid Decision Models", "arxiv": "2611.16961", "area": "Reasoning", "tagline": "A small router decides per request whether slow step-by-step reasoning is worth its cost.", "simple": ["Reasoning models can answer instantly, or think out loud for many tokens first. Thinking is more accurate but expensive, and for easy questions it is wasted.", "This paper adds a small router that looks at the model's quick first guess and estimates how much thinking would help. If that value is bigger than the price of thinking, it thinks; otherwise it answers right away. Because the estimate is in the same units as the price, one router works for any price."], "built": ["A frozen random-feature backbone, a fast linear head (0 tokens) and a slow decoder that sees extra noisy looks at the input and costs 64 tokens, standing in for real reasoning.", "A synthetic 8-intent task where each request has a hidden difficulty the router never sees.", "A 2-layer MLP router trained two ways: supervised regression on the true value, and my reading of CDPO, which learns only from episode-level returns using REINFORCE with a group baseline.", "A calibration term that keeps the router's estimates inside the price range; without it they drifted to about -9."], "code": {"file": "hdm.py", "ranges": [[172, 206]]}, "chart": {"title": "Reasoning tokens per request at price 0.10", "unit": "tokens", "better": "lower", "fmt": "f1", "bars": [["Always think", 64.0, 0], ["Router (supervised)", 22.9, 1], ["Router (CDPO)", 21.3, 1]]}, "verdict": "Reproduced, with a caveat", "takeaways": ["Routing recovers nearly all of the slow mode's accuracy (0.988 vs 0.998) with about 63% fewer reasoning tokens.", "CDPO, trained only on episode returns, gets close to the supervised router.", "In this toy, a plain confidence threshold ranks requests about as well as the learned router. The router's real advantage is that its outputs can be compared directly with a price."], "codeChunks": [{"start": 172, "lines": ["    def fit_cdpo(self, f, fast_ok, slow_ok, episodes=3000, L=16, G=8,", "                 lam_range=(-0.1, 0.6), tau=0.05, lr=3e-3, calib=1.0, seed=0):", "        \"\"\"Each step: sample B episodes of L requests and a price lambda per episode;", "        roll out G independent routing samples per episode (group baseline);", "        only the episode return R = sum(correct) - lambda * #slow is observed.", "", "        Policy: pi(slow | x, lambda) = sigmoid((v_hat(x) - lambda) / tau).", "        REINFORCE gradient wrt v_hat_i is A * (a_i - p_i) / tau.", "        Because lambda enters additively against v_hat, the optimum of this", "        objective is v_hat(x) = E[slow_ok - fast_ok | x] -> a calibrated value.", "        \"\"\"", "        rng = np.random.default_rng(seed)", "        self._norm(f)", "        n = len(fast_ok)", "        B = 16", "        for _ in range(episodes // B):", "            idx = rng.integers(0, n, size=(B, L))", "            lam = rng.uniform(*lam_range, size=B)", "            fi = f[idx.ravel()]", "            vh = self.value(fi).reshape(B, L)", "            p = 1 / (1 + np.exp(-(vh - lam[:, None]) / tau))", "            a = (rng.random((G, B, L)) < p[None]).astype(float)", "            correct = np.where(a == 1, slow_ok[idx][None], fast_ok[idx][None])", "            R = correct.sum(-1) - lam[None] * a.sum(-1)                    # (G, B)", "            A = R - R.mean(0, keepdims=True)                                # group baseline", "            A = A / (R.std(0, keepdims=True) + 1.0)                         # mild scaling", "            # ascend E[R]: dv = -A * (a - p) / tau (minimise negative), averaged over groups", "            dv = -(A[..., None] * (a - p[None]) / tau).mean(0).ravel() / (B * L)", "            # calibration term: outside the price range the policy gradient vanishes", "            # and v_hat can drift without bound; a squared hinge keeps it in a box.", "            lo, hi = lam_range[0] - 2 * tau, lam_range[1] + 2 * tau", "            vf = vh.ravel()", "            dv = dv + calib * (2 * (np.maximum(vf - hi, 0) - np.maximum(lo - vf, 0))) / (B * L)", "            self._step(self._grads(fi, dv), lr)", "        return self"]}], "demo": "fast-mode acc 0.875 (0 tokens) | slow-mode acc 0.998 (64 tokens)\nfraction of requests where thinking helps: 0.124, hurts: 0.001\n\nThreshold-free comparison: mean accuracy over all slow-call budgets\n  random                                   0.9382\n  confidence (1 - max p)                   0.9792\n  value router (supervised)                0.9775\n  value router (CDPO, episode returns)     0.9745\n\nPrice-conditioned routing (slow iff v_hat > lambda), utility = acc - lambda * slow_frac\n  lambda | policy                acc  slow%  tokens  utility\n    0.02 | always-fast         0.875   0.0%     0.0   0.8747\n    0.02 | always-slow         0.998 100.0%    64.0   0.9780\n    0.02 | supervised HDM      0.993  53.3%    34.1   0.9818\n    0.02 | CDPO HDM            0.988  44.2%    28.3   0.9788\n    0.05 | always-fast         0.875   0.0%     0.0   0.8747\n    0.05 | always-slow         0.998 100.0%    64.0   0.9480\n    0.05 | supervised HDM      0.991  45.4%    29.1   0.9686\n    0.05 | CDPO HDM            0.985  39.4%    25.2   0.9649\n    0.10 | always-fast         0.875   0.0%     0.0   0.8747\n    0.10 | always-slow         0.998 100.0%    64.0   0.8980\n    0.10 | supervised HDM      0.987  35.8%    22.9   0.9516\n    0.10 | CDPO HDM            0.980  33.4%    21.3   0.9470\n    0.20 | always-fast         0.875   0.0%     0.0   0.8747\n    0.20 | always-slow         0.998 100.0%    64.0   0.7980\n    0.20 | supervised HDM      0.977  26.2%    16.8   0.9242\n    0.20 | CDPO HDM            0.965  23.8%    15.2   0.9178\n    0.40 | always-fast         0.875   0.0%     0.0   0.8747\n    0.40 | always-slow         0.998 100.0%    64.0   0.5980\n    0.40 | supervised HDM      0.947  14.4%     9.2   0.8896\n    0.40 | CDPO HDM            0.931  11.9%     7.6   0.8835\n\nCalibration (test set, binned by predicted v_hat):\n  supervised pred -0.094 / real +0.015 | pred -0.006 / real +0.009 | pred +0.101 / real +0.072 | pred +0.483 / real +0.398\n  CDPO       pred -0.177 / real +0.017 | pred -0.062 / real +0.016 | pred +0.072 / real +0.086 | pred +0.424 / real +0.375\n\nHeadline: supervised HDM reaches acc 0.988 (always-slow 0.998) using 23.9 tokens/request vs 64 -> 62.6% fewer tokens (lambda=0.090)\ndone in 6.5s", "demoCmd": "python demo.py", "demoStatus": "exit 0 · 11s · run 2026-11-26", "tests": ".......                                                                  [100%]\n7 passed in 3.22s", "testCmd": "python -m pytest -q", "testsPassed": 7, "testStatus": "7 passed"}, {"slug": "2026-11-17-productive-preemption", "date": "2026-11-17", "short": "Productive Preemption", "title": "Making Preemption Productive in Long-Output LLM Serving", "arxiv": "2611.20106", "area": "LLM serving", "tagline": "Use predicted output lengths to stop LLM servers from evicting and rebuilding the same requests over and over.", "simple": ["An LLM server runs many requests at once and keeps each one's memory (the KV cache) on the GPU. With long answers, that memory keeps growing. A simple server lets new requests in whenever there is room right now, then has to kick one out when memory fills up, throwing away its work. That request comes back, grows, and gets kicked out again. This is called thrashing.", "The fix is to look ahead: guess how long each answer will be, and only let a request in if memory will still fit at the busiest future moment. Evictions become rare and cheap instead of constant."], "built": ["A discrete-time simulator of a continuous-batching server with a fixed KV budget, Poisson arrivals and heavy-tailed output lengths.", "Three schedulers: reactive (vLLM-style), a 10% memory watermark, and proactive admission that simulates the batch's future memory curve with predicted lengths.", "A noisy length predictor (true length times lognormal noise), and sweeps over memory size, prediction noise and recompute cost.", "Note: the arXiv page could not be fetched when I built this, so the policies are my own simplified versions of the idea."], "code": {"file": "sim.py", "ranges": [[102, 122]]}, "chart": {"title": "KV tokens recomputed (40K-token cache, 200 requests)", "unit": "tokens", "better": "lower", "fmt": "int", "bars": [["Reactive", 516183, 0], ["Watermark", 199652, 0], ["Proactive", 56491, 1]]}, "verdict": "Reproduced, it is a trade-off", "takeaways": ["Thrashing shows up clearly: the reactive policy preempts about 680 times for 200 requests.", "Proactive admission cuts wasted recompute by about 89% and preemptions by about 91%.", "When recompute is cheap, packing memory aggressively still wins on throughput by about 10%. As recompute gets more expensive the gap closes and reverses."], "codeChunks": [{"start": 102, "lines": ["    def projected_peak(batch, extra=None):", "        extra = extra or {}", "        kv = np.array([extra.get(x.rid, x.kv) for x in batch], dtype=np.int64)", "        rem = np.array([max(x.predicted - x.generated, 1) for x in batch], dtype=np.int64)", "        # usage(t) = sum_{i: rem_i > t} (kv_i + t); max is reached at t = rem_j - 1", "        ts = rem - 1", "        alive = rem[None, :] > ts[:, None]", "        usage = (alive * (kv[None, :] + ts[:, None])).sum(axis=1)", "        return int(usage.max())", "", "    def can_admit(r):", "        need = r.prompt + r.generated + 1  # recompute context + first new token", "        if policy == \"reactive\":", "            return used() + need <= capacity", "        if policy == \"watermark\":", "            return used() + need <= capacity * (1 - watermark)", "        # proactive: simulate the batch's KV trajectory using predicted lengths", "        # and admit only if its projected peak (incl. the newcomer) fits.", "        if not running:", "            return need <= capacity", "        return projected_peak(running + [r], extra={r.rid: need}) <= capacity"]}], "demo": "\n### KV capacity 40,000 tokens, 200 long-output requests, predictor noise 0.25\n\n| policy | makespan | throughput_tok_per_t | preemptions | recompute_tokens | mean_latency | p99_latency |\n|---|---|---|---|---|---|---|\n| reactive | 46959.6 | 11.3 | 679 | 516183 | 20977.6 | 45385.3 |\n| watermark | 48179.8 | 11.02 | 236 | 199652 | 21396.6 | 45957.8 |\n| proactive | 52086.0 | 10.19 | 58 | 56491 | 23329.6 | 50201.8 |\n\n### KV capacity 60,000 tokens, 200 long-output requests, predictor noise 0.25\n\n| policy | makespan | throughput_tok_per_t | preemptions | recompute_tokens | mean_latency | p99_latency |\n|---|---|---|---|---|---|---|\n| reactive | 36692.8 | 14.46 | 631 | 486356 | 15863.0 | 34734.9 |\n| watermark | 37060.1 | 14.32 | 178 | 139891 | 16037.1 | 35293.3 |\n| proactive | 38168.9 | 13.9 | 45 | 36392 | 16683.0 | 36626.5 |\n\n### Sensitivity of proactive policy to length-prediction error (capacity 40,000)\n\n| policy | makespan | throughput_tok_per_t | preemptions | recompute_tokens | mean_latency | p99_latency |\n|---|---|---|---|---|---|---|\n| proactive, noise=0.0 | 50476.4 | 10.51 | 20 | 20723 | 22736.0 | 49344.8 |\n| proactive, noise=0.25 | 52086.0 | 10.19 | 58 | 56491 | 23329.6 | 50201.8 |\n| proactive, noise=0.6 | 66326.3 | 8.0 | 42 | 45344 | 30883.4 | 63721.2 |\n| proactive, noise=1.0 | 69834.4 | 7.6 | 22 | 23444 | 31818.5 | 66337.1 |\n\n### Sensitivity to recompute cost (capacity 40,000)\n\n| policy | makespan | throughput_tok_per_t | preemptions | recompute_tokens | mean_latency | p99_latency |\n|---|---|---|---|---|---|---|\n| reactive, recompute cost=0.0015/tok | 46959.6 | 11.3 | 679 | 516183 | 20977.6 | 45385.3 |\n| watermark, recompute cost=0.0015/tok | 48179.8 | 11.02 | 236 | 199652 | 21396.6 | 45957.8 |\n| proactive, recompute cost=0.0015/tok | 52086.0 | 10.19 | 58 | 56491 | 23329.6 | 50201.8 |\n| reactive, recompute cost=0.005/tok | 49216.1 | 10.78 | an inverted index on the subject, a full-name match, a filter to rows whose value is among the options, then ranking by cue weights learned from just 10 labeled examples.", "A hand-written dense attention layer as the Transformer-style baseline.", "A synthetic world with 8% corrupted and 8% missing facts, plus experiments for error attribution, delete-one-row locality, row editing and query latency."], "code": {"file": "wsp/memory.py", "ranges": [[92, 118]]}, "chart": {"title": "Accuracy on 470 four-option questions", "unit": "accuracy", "better": "higher", "fmt": "f3", "bars": [["Sparse table + 10-example cues", 0.862, 1], ["Sparse table, no cues", 0.834, 1], ["Dense attention, d=128", 0.743, 0]]}, "verdict": "Reproduced", "takeaways": ["The sparse table beats the dense layer (0.862 vs 0.743) with 32x fewer parameters.", "Every error has an address: a missing fact, a corrupted row, or a wrong-row choice. Rewriting the 43 corrupted rows lifts accuracy to 0.919 with no retraining.", "Deleting a row changes 0.69 answers on average and never more than 2, close to the paper's 'about one other answer'."], "codeChunks": [{"start": 92, "lines": ["    def _subject_rows(self, text: str) -> list[int]:", "        toks = set(tokenize(text))", "        cand = set()", "        for t in toks:", "            cand |= self.index.get(t, set())", "        out = []", "        for rid in cand:", "            row = self.rows[rid]", "            if row is not None and set(row.subject) <= toks:   # full-name match", "                out.append(rid)", "        return sorted(out)", "", "    def _score(self, text, row):", "        words = self._content_words(text, row.subject)", "        s = sum(self.cue.get((w, row.predicate), 0.0) for w in words)", "        s += 0.1 * len(set(words) & set(row.predicate))      # lexical fallback", "        return s", "", "    def explain(self, text: str, options: list[str]):", "        \"\"\"Return (chosen option index, row id used or None).\"\"\"", "        cands = [rid for rid in self._subject_rows(text) if self.rows[rid].value in options]", "        if not cands:", "            return 0, None                       # abstain -> first option", "        best = max(cands, key=lambda rid: (self._score(text, self.rows[rid]), -rid))", "        return options.index(self.rows[best].value), best", "", "    def predict(self, text: str, options: list[str]) -> int:"]}], "demo": "world: 442 fact sentences, 10 labeled examples, 470 test questions (43 corrupted facts, 38 missing facts)\nceiling (answerable & correct in text): 0.828\n\n== 1. accuracy / size ==\nsparse table (+10-example cues)    acc=0.862  params=   2397\nsparse table (no cues)             acc=0.834  params=   2385\ndense attention, d=128             acc=0.743  params=  77248\nparam ratio dense/sparse: 32.2x\n\n== 2. error attribution (sparse) ==\n  no row (fact missing from text)    38\n  picked wrong row (cue error)       15\n  used a corrupted row               12\n\n== 3. delete-one-row locality ==\n  answers changed per deleted row: mean=0.69  max=2  histogram={0: 144, 1: 289, 2: 9}\n\n== 4. rewrite corrupted rows ==\n  edited 43 rows: acc 0.862 -> 0.919\n\n== 5. query latency (single query, CPU) ==\n  rows=  1000  sparse=    10.3 us  dense=     94.4 us  speedup=   9.2x\n  rows= 10000  sparse=     9.3 us  dense=    648.6 us  speedup=  69.7x\n  rows= 50000  sparse=    14.4 us  dense=   7519.6 us  speedup= 522.7x", "demoCmd": "python demo.py", "demoStatus": "exit 0 · 21s · run 2026-11-26", "tests": ".......                                                                  [100%]\n7 passed in 0.15s", "testCmd": "python -m pytest -q", "testsPassed": 7, "testStatus": "7 passed"}, {"slug": "2026-11-19-multi-branch-transformer", "date": "2026-11-19", "short": "Multi-Branch Transformer", "title": "Multi-Branch Transformer", "arxiv": "2611.19800", "area": "Architectures", "tagline": "Scale a Transformer by branching it into parallel paths, and share one KV cache across them.", "simple": ["Transformers usually grow wider or deeper. This paper adds a third option: split the middle of the network into several branches that run side by side, then merge them. Branches run in parallel, so the model can need fewer sequential steps.", "Joint-KV is the memory trick: all branches at the same depth share one set of keys and values, so the memory kept during generation shrinks by the number of branches while the parameter count stays the same."], "built": ["Prelude, K parallel branches, fusion (concat + per-branch RMSNorm, or a mean for comparison) and coda, in JAX on CPU.", "Wide-Shallow, Balanced and Narrow-Deep layouts with branch widths chosen so compute per token matches the standard model.", "Joint-KV with tests for equal parameters and a 1/K cache.", "A character-level language model on Python standard-library source, 6 variants x 2 seeds, about 0.3M parameters."], "code": {"file": "mbt.py", "ranges": [[150, 159]]}, "chart": {"title": "KV cache size relative to the standard model", "unit": "x standard", "better": "lower", "fmt": "x2", "bars": [["MBT Narrow-Deep", 1.25, 0], ["MBT Balanced", 1.15, 0], ["Standard", 1.0, 0], ["MBT Wide-Shallow", 1.0, 0], ["MBT Balanced + Joint-KV", 0.74, 1]]}, "verdict": "Partly reproduced", "takeaways": ["At this tiny scale MBT with concat fusion does not beat the standard model at matched compute.", "Wide-Shallow with mean fusion ties the standard model while needing 4 sequential blocks instead of 6.", "Joint-KV is a free win: it cuts the KV cache to 0.74x of the standard model with identical parameters and FLOPs, and slightly improves loss."], "note": "This demo needs JAX and takes about 25 minutes on CPU, so the output shown is the saved log from my original run rather than a rerun.", "codeChunks": [{"start": 150, "lines": ["            x = block_fwd(blk, x, cfg.n_heads)", "    else:", "        h = x @ p[\"in_proj\"] if \"in_proj\" in p else x", "        zs = [h] * cfg.K", "        for l, depth in enumerate(p[\"branches\"]):", "            if cfg.joint_kv:", "                # synchronise branches at this depth: ONE shared K/V (this is what gets cached)", "                s = jnp.concatenate([rmsnorm(z, blk[\"n1\"]) for z, blk in zip(zs, depth)], -1)", "                kv = (s / math.sqrt(cfg.K)) @ p[\"joint_wkv\"][l]", "                zs = [block_fwd(blk, z, cfg.n_heads, kv=kv) for z, blk in zip(zs, depth)]"]}], "demo": "corpus: 540000 train chars, vocab 110, steps 600, seeds [0, 1]\n\ndone Standard (6 seq blocks): 2.3755\ndone MBT Wide-Shallow K=2 (2x2@64): 2.3973\ndone MBT Balanced K=2 (3x2@52): 2.4693\ndone MBT Narrow-Deep K=2 (4x2@44): 2.4735\ndone MBT Balanced K=2 + Joint-KV: 2.4609\ndone MBT Wide-Shallow K=2, mean fusion: 2.3635\n\n| Variant | Params | FLOPs/tok | Seq. depth | KV cache vs Std | Val loss (mean ± std, 2 seeds) | Train s |\n|---|---|---|---|---|---|---|\n| Standard (6 seq blocks) | 306,880 | 590K | 6 | 1.00x | 2.3755 ± 0.0054 | 76 |\n| MBT Wide-Shallow K=2 (2x2@64) | 315,200 | 606K | 4 | 1.00x | 2.3973 ± 0.0050 | 79 |\n| MBT Balanced K=2 (3x2@52) | 315,160 | 606K | 5 | 1.15x | 2.4693 ± 0.0078 | 76 |\n| MBT Narrow-Deep K=2 (4x2@44) | 304,856 | 585K | 6 | 1.25x | 2.4735 ± 0.0100 | 76 |\n| MBT Balanced K=2 + Joint-KV | 315,160 | 606K | 5 | 0.74x | 2.4609 ± 0.0061 | 78 |\n| MBT Wide-Shallow K=2, mean fusion | 306,880 | 590K | 4 | 1.00x | 2.3635 ± 0.0127 | 79 |", "demoCmd": "python demo.py 600", "demoStatus": "saved log from original run", "tests": ".......                                                                  [100%]\n7 passed in 11.26s", "testCmd": "python -m pytest -q", "testsPassed": 7, "testStatus": "7 passed"}, {"slug": "2026-11-20-anisoflow", "date": "2026-11-20", "short": "AnisoFlow", "title": "Learning Anisotropic Prediction Targets for Flow Models (AnisoFlow)", "arxiv": "2611.17767", "area": "Generative models", "tagline": "Let a flow model predict a different mix of noise and data in each direction.", "simple": ["Flow models generate data by learning to push random noise toward real samples. The network is trained to predict one fixed thing: the velocity, the noise, or the clean data.", "This paper says the best thing to predict can be different in different directions. In directions where the data varies a lot, predicting more of the noise helps; where it barely varies, less. A closed-form formula converts any such prediction back to a velocity, so training and sampling stay the same."], "built": ["The anisotropic target y = x - W e with W = Q diag(w) Q^T, and the closed-form inversion back to a velocity for the ODE sampler.", "A NumPy SiLU MLP with manual backprop and Adam, an Euler sampler and a sliced-Wasserstein metric.", "2D toy data: a 4-mode mixture along a wide axis and a thin Gaussian along the other, rotated 30 degrees.", "A grid search over the two per-direction weights with 2 seeds each, plus a check of how the best weight scales with data variance. Q is the data's PCA basis rather than learned."], "code": {"file": "anisoflow.py", "ranges": [[16, 33]]}, "chart": {"title": "Sliced-Wasserstein distance, samples vs data", "unit": "distance", "better": "lower", "fmt": "f4", "bars": [["x-prediction (0, 0)", 0.176, 0], ["v-prediction (1, 1)", 0.1287, 0], ["Anisotropic (1.5, 0.5)", 0.0992, 1]]}, "verdict": "Reproduced in direction", "takeaways": ["The anisotropic target improves sample quality by about 23% over v-prediction and 44% over x-prediction.", "The best setting gives the wide direction a higher noise weight (1.5) than the thin one (0.5), matching the paper's claim.", "The variance-scaling trend points the right way but the differences are tiny here; the robust finding is that w = 0 is worst at every scale."], "codeChunks": [{"start": 16, "lines": ["def make_W(Q, w):", "    return Q @ np.diag(w) @ Q.T", "", "", "def target(x, e, W):", "    return x - e @ W.T", "", "", "def pred_to_velocity(y, xt, t, W):", "    \"\"\"Map predicted target y to velocity. t has shape (n, 1).\"\"\"", "    d = xt.shape[1]", "    n = xt.shape[0]", "    I = np.eye(d)", "    M = t[:, :, None] * W[None] + (1 - t)[:, :, None] * I[None]          # (n, d, d)", "    rhs = xt - t * y", "    e = np.linalg.solve(M, rhs[:, :, None])[:, :, 0]", "    return y + e @ (W - I).T", ""]}], "demo": "PCA variances: major=4.017 minor=0.0101\n\nw_major w_minor | val vel-MSE | sliced-W (samples vs data)\n  1.50   0.50   |   1.5052    |  0.0992\n  1.50   0.25   |   1.5113    |  0.1081\n  1.50   1.00   |   1.5211    |  0.1236\n  1.00   0.50   |   1.5238    |  0.1259\n  1.00   0.25   |   1.5244    |  0.1264\n  1.00   1.00   |   1.5264    |  0.1287 <- v-pred\n  1.50   1.50   |   1.5285    |  0.1280\n  1.00   1.50   |   1.5324    |  0.1319\n  0.50   0.25   |   1.5335    |  0.1346\n  0.50   1.00   |   1.5344    |  0.1360\n  0.50   1.50   |   1.5351    |  0.1368\n  0.50   0.50   |   1.5359    |  0.1373\n  0.25   1.50   |   1.5432    |  0.1474\n  0.25   1.00   |   1.5434    |  0.1476\n  0.25   0.50   |   1.5440    |  0.1477\n  0.25   0.25   |   1.5441    |  0.1476\n  0.00   0.25   |   1.5882    |  0.1738\n  0.00   0.50   |   1.5888    |  0.1737\n  0.00   1.00   |   1.5936    |  0.1758\n  0.00   1.50   |   1.5955    |  0.1750\n  1.00   0.00   |   1.6347    |  0.1268\n  1.50   0.00   |   1.6395    |  0.1229\n  0.25   0.00   |   1.6412    |  0.1490\n  0.50   0.00   |   1.6424    |  0.1428\n  0.00   0.00   |   1.6706    |  0.1760 <- x-pred\n\nBest anisotropic w (selected by val vel-MSE): (1.5, 0.5)\n  x-pred            vel-MSE=1.6706  SW=0.1760\n  v-pred            vel-MSE=1.5264  SW=0.1287\n  anisotropic best  vel-MSE=1.5052  SW=0.0992\n\nPreferred w vs data std (isotropic sweep per scale, 1 seed):\n  std= 0.1  best w=0.50  0.0:0.150 0.25:0.138 0.5:0.138 1.0:0.138 1.5:0.139 2.0:0.139\n  std= 0.5  best w=0.50  0.0:0.848 0.25:0.763 0.5:0.762 1.0:0.762 1.5:0.763 2.0:0.764\n  std= 1.0  best w=2.00  0.0:1.674 0.25:1.542 0.5:1.540 1.0:1.539 1.5:1.539 2.0:1.539\n  std= 2.0  best w=2.00  0.0:3.178 0.2 rt": "AIMuon", "title": "Accelerating Muon with Spectral Residual Correction (AIMuon)", "arxiv": "2611.27077", "area": "Optimizers", "tagline": "Add back the part of the fresh gradient that Muon's momentum has not caught up with yet.", "simple": ["Muon is an optimizer that takes the momentum of a weight matrix and turns it into a clean 'direction' matrix before stepping. Momentum is an average of past gradients, so it always lags a little behind what the latest gradient says.", "AIMuon also computes the leftover part, the fresh gradient minus what momentum already captured, turns that into a direction too, and blends the two based on how much each one would reduce the loss."], "built": ["Quintic Newton-Schulz orthogonalisation with Muon's coefficients, and Muon with Nesterov or plain momentum.", "AIMuon as my reconstruction: residual R = G - (1 - beta) m, both directions orthogonalised, weighted by their dual pairing with the gradient, then rescaled to Muon's update norm.", "A teacher-student tanh MLP in NumPy with manual backprop, 5 seeds, 600 steps.", "Tests that Newton-Schulz matches the exact SVD polar factor and that the AIMuon update is a descent direction."], "code": {"file": "aimuon.py", "ranges": [[68, 81]]}, "chart": {"title": "Final loss after 600 steps (5 seeds)", "unit": "MSE", "better": "lower", "fmt": "f4", "bars": [["Muon, plain momentum", 0.07461, 0], ["SGD-momentum", 0.05942, 0], ["AIMuon, plain momentum", 0.02937, 1], ["AIMuon, Nesterov", 0.02219, 1], ["Muon, Nesterov", 0.02212, 0]]}, "verdict": "Partly reproduced", "note": "The rerun uses a different NumPy build than my original run, so late-training losses differ slightly from the README (for example Muon Nesterov 0.0221 here vs 0.0225). The pattern is the same.", "takeaways": ["With plain momentum the correction is a big win: final loss drops from 0.075 to 0.029.", "With Nesterov momentum, which already folds the fresh gradient back in, AIMuon is 12% better early but ends level with Muon.", "Th t more room when it is unsure.", "simple": ["Reasoning models write very long traces that repeat themselves: loops, re-checks, corrections. Cache-compression methods like H2O keep the tokens that get the most attention, but repeated tokens all get attention, so the budget fills up with copies of the same thought.", "RoCoKV lowers a token's score when a later token says nearly the same thing, so one copy is kept. It also grows the cache budget when the model is uncertain and shrinks it when the model is confident."], "built": ["An H2O-style baseline: accumulated attention normalised by token age, plus a protected recent window.", "Redundancy as each key's maximum cosine similarity to any later key, used to down-weight the score.", "An uncertainty-adaptive budget from next-token entropy, EMA-smoothed and z-scored online, mapped to 0.5x-1.5x of the base budget.", "A synthetic 800-token reasoning trace with injected loops, scored by KL and top-1 agreement against the full cache over 5 seeds."], "code": {"file": "rocokv.py", "ranges": [[73, 83], [93, 110]]}, "chart": {"title": "KL from the full cache, budget 256 (32% of trace)", "unit": "KL", "better": "lower", "fmt": "f4", "bars": [["RoCoKV (adaptive budget)", 0.1833, 0], ["Redundancy-only, matched memory", 0.1723, 0], ["H2O baseline", 0.1471, 0], ["+ redundancy-aware selection", 0.1117, 1]]}, "verdict": "Partly reproduced", "takeaways": ["Redundancy-aware selection helps at moderate budgets: about 24% lower KL than H2O at a 32% budget.", "The adaptive budget did not pay off here. Eviction is irreversible, so a fluctuating budget drifts toward its minimum; the first unsmoothed version was clearly worse.", "Making 'spend more memory when unsure' work probably needs lookahead or offloading evicted KV to CPU."], "codeChunks": [{"start": 73, "lines": ["    def redundancy(self):", "        \"\"\"For each cached token: max cosine similarity of its key to any *more", "        recent* cached key (so the newest copy of a repeated thought is kept).\"\"\"", "        Kn = self.K / (np.linalg.norm(self.K, axis=1, keepdims=True) + 1e-8)", "        S = Kn @ Kn.T", "        n = len(S)", "        S[np.tril_indices(n)] = -1.0   # only compare against later tokens", "        r = S.max(axis=1)", "        r[-1] = 0.0", "        return np.clip((r - self.sim_thresh) / (1 - self.sim_thresh), 0.0, 1.0)", ""]}, {"start": 93, "lines": ["    def compress(self, uncertainty):", "        b = self.budget_for(uncertainty)", "        self.budget_trace.append(b)", "        n = len(self.K)", "        if n <= b:", "            self.size_trace.append(n)", "            return", "        keep_recent = np.arange(max(0, n - self.recent), n)", "        cand = np.arange(0, max(0, n - self.recent))", "        imp = self.score[cand] / (n - cand)          # normalise by age", "        if self.policy == \"rocokv\":", "            imp = imp * (1.0 - self.lam * self.redundancy()[cand])", "        n_keep = max(0, b - len(keep_recent))", "        keep = cand[np.argsort(-imp)[:n_keep]]", "        idx = np.sort(np.concatenate([keep, keep_recent]))", "        self.K, self.V, self.score = self.K[idx], self.V[idx], self.score[idx]", "        self.size_trace.append(len(idx))", ""]}], "demo": "Trace length 800, d=32, 5 seeds averaged\n\n--- average KV budget = 64 (8% of trace) ---\nmethod                                      KL(full||comp)  top1 agree avg KV held\nH2O (heavy hitters + recent)                        0.7030       0.412        64.0\n+ redundancy-aware selection                        0.7248       0.384        64.0\n+ uncertainty-adaptive budget (RoCoKV)              0.7911       0.386        64.7\n  (redundancy-only, matched memory)                 0.7020       0.389        65.0\n\n--- average KV budget = 128 (16% of trace) ---\nmethod                                      KL(full||comp)  top1 agree avg KV held\nH2O (heavy hitters + recent)                        0.3284       0.584       128.0\n+ redundancy-aware selection function fmtVal(v, f) {
  if (f === "pct") return Math.round(v * 100) + "%";
  if (f === "pct1") return (v * 100).toFixed(1) + "%";
  if (f === "int") return v.toLocaleString("en-US");
  if (f === "x2") return v.toFixed(2) + "x";
  if (f === "f1") return v.toFixed(1);
  if (f === "f2") return v.toFixed(2);
  if (f === "f3") return v.toFixed(3);
  return v.toFixed(4);
}

function highlight(line) {
  let h = esc(line);
  h = h.replace(/(&quot;.*?&quot;|&#39;.*?&#39;)/g, '<span class="s">$1</span>');
  const i = h.indexOf("#");
  if (i >= 0 && !/<span class="s">[^<]*#/.test(h.slice(0, i + 1))) h = h.slice(0, i) + '<span class="c">' + h.slice(i) + "</span>";
  return h;
}

  const parts = p.codeChunks.map(ch => ch.lines.map((l, k) => `<span class="ln" data-n="${ch.start + k}">${highlight(l) || " "}</span>`).join(""));
  const ranges = p.codeChunks.map(ch => `${ch.start}-${ch.start + ch.lines.length - 1}`).join(", ");
  return `<div class="code"><div class="code-head"><span>${esc(p.slug)}/${esc(p.code.file)}</span><span>lines ${ranges}</span></div>
    <pre>${parts.join('<span class="gap">&hellip;</span>')}</pre></div>`;
}

function term(cmd, out, status, cls) {
  return `<div class="term ${cls || ""}"><div class="term-bar"><span class="dots"><i></i><i></i><i></i></span><span class="cmd">$ ${esc(cmd)}</span><span class="ok">${esc(status)}</span></div>
    <pre>${esc(out)}</pre></div>`;
}

function chart(p) {
  const c = p.chart, n = c.bars.length;
  const W = 640, labelW = 210, valW = 78, rowH = 40, top = 6, barH = 18;
  const H = top + n * rowH + 22;
  const max = Math.max(...c.bars.map(b => b[1]));
  const x = v => labelW + (v / max) * (W - labelW - valW);
  const ticks = [0, 0.5, 1].map(f => f * max);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title)}">`;
  ticks.forEach(t => { s += `<line x1="${x(t)}" x2="${x(t)}" y1="${top}" y2="${top + n * rowH}" stroke="var(--line)" stroke-width="1"/>`;
    s += `<text x="${x(t)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--muted)">${fmtVal(t, c.fmt)}</text>`; });
  c.bars.forEach((b, i) => {
    const y = top + i * rowH + (rowH - barH) / 2, w = Math.max(x(b[1]) - labelW, 2);
    const fill = b[2] ? "var(--bar-hi)" : "var(--bar)";
    s += `<text x="${labelW - 12}" y="${y + barH / 2 + 4}" text-anchor="end" font-size="13" fill="var(--ink)">${esc(b[0])}</text>`;
    s += `<rect class="hit" x="0" y="${top + i * rowH}" width="${W}" height="${rowH}" fill="transparent" tabindex="0" data-tip="${esc(b[0])}: ${esc(fmtVal(b[1], c.fmt))}"/>`;
    s += `<path class="bar" fill="${fill}" d="M${labelW},${y} h${w - 4} a4,4 0 0 1 4,4 v${barH - 8} a4,4 0 0 1 -4,4 h${-(w - 4)} z"/>`;
    s += `<text x="${labelW + w + 8}" y="${y + barH / 2 + 4}" font-size="13" font-weight="600" fill="var(--ink)" style="font-variant-numeric:tabular-nums">${esc(fmtVal(b[1], c.fmt))}</text>`;
  });
  s += `<line x1="${labelW}" x2="${labelW}" y1="${top}" y2="${top + n * rowH}" stroke="var(--muted)" stroke-width="1"/></svg>`;
  return `<div class="chart-card"><h3>${esc(c.title)}</h3>
    <div class="chart-sub"><span>${c.better === "lower" ? "Lower is better" : "Higher is better"} &middot; ${esc(c.unit)}</span>
      <span class="key"><i style="background:var(--bar-hi)"></i>This paper's method</span><span class="key"><i style="background:var(--bar)"></i>Baselines</span></div>
    <div class="chart chart-scroll"><div style="min-width:480px">${s}</div></div>
    <details class="table"><summary>Show as table</summary><table><thead><tr><th>Variant</th><th>Value</th></tr></thead><tbody>
      ${c.bars.map(b => `<tr><td>${esc(b[0])}</td><td>${esc(fmtVal(b[1], c.fmt))}</td></tr>`).join("")}</tbody></table></details>
    <div class="chart-sub">${p.demoStatus.startsWith("exit") ? "Numbers from the run shown below." : "Numbers from the saved run log shown below."}</div></div>`;
}

function renderPaper(p) {
  document.title = p.short + " | Paper Implementations";
  const i = DATA.indexOf(p), prev = DATA[i - 1], next = DATA[i + 1];
  const folder = `${REPO}/tree/main/${p.slug}`;
  app.innerHTML = `
    <nav class="crumbs"><a href="#">&larr; All papers</a><span class="eyebrow">${fmtDate(p.date)} &middot; ${esc(p.area)}</span></nav>
    <header class="hero">
      <span class="verdict ${isFull(p.verdict) ? "full" : "part"}">${esc(p.verdict)}</span>
      <h1>${esc(p.short)}</h1>
      <p class="tagline">${esc(p.tagline)}</p>
      <p class="full-title">${esc(p.title)} &middot; <span class="mono">arXiv:${p.arxiv}</span></p>
      <div class="links"><a class="btn primary" href="${folder}">Code on GitHub</a><a class="btn" href="https://arxiv.org/abs/${p.arxiv}">Read the paper</a></div>
    </header>
    <section class="block plain"><h2>In plain words</h2><div class="body">${p.simple.map(t => `<p>${esc(t)}</p>`).join("")}</div></section>
    <section class="block"><h2>How I built it</h2><div class="body"><ul class="built">${p.built.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div></section>
    <section class="block"><h2>The result</h2><div class="body">${chart(p)}</div></section>
    <section class="block"><h2>See it run</h2><div class="body">
      ${p.note ? `<p class="note">${esc(p.note)}</p>` : ""}
      ${term(p.demoCmd, p.demo, p.demoStatus)}
      ${term(p.testCmd, p.tests, p.testStatus, "tests")}
    </div></section>
    <section class="block"><h2>The core code</h2><div class="body">${codeBlock(p)}</div></section>
    <section class="block"><h2>What it showed</h2><div class="body"><ol class="results">${p.takeaways.map(t => `<li><span>${esc(t)}</span></li>`).join("")}</ol></div></section>
    <nav class="pager">
      ${prev ? `<a href="#p-${prev.date}"><span>&larr; ${prev.date}</span>${esc(prev.short)}</a>` : "<span></span>"}
      ${next ? `<a class="next" href="#p-${next.date}"><span>${next.date} &rarr;</span>${esc(next.short)}</a>` : ""}
    </nav>`;
  wireTips();
}

function wireTips() {
  app.querySelectorAll("[data-tip]").forEach(el => {
    const show = e => { tip.textContent = el.dataset.tip; tip.hidden = false;
      const r = el.getBoundingClientRect(); const px = e && e.clientX ? e.clientX : r.left + 220; const py = e && e.clientY ? e.clientY : r.top;
      tip.style.left = Math.min(px + 12, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = (py - 34) + "px"; };
    el.addEventListener("mousemove", show); el.addEventListener("focus", () => show());
    el.addEventListener("mouseleave", () => tip.hidden = true); el.addEventListener("blur", () => tip.hidden = true);
  });
}

function route() {
  tip.hidden = true;
  const m = location.hash.match(/^#p-(\d{4}-\d{2}-\d{2})$/);
  const p = m && DATA.find(x => x.date === m[1]);
  if (p) renderPaper(p); else renderIndex();
  window.scrollTo(0, 0);
}
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
